<text x='20' y='246' font-size='12' fill='#666666' text-anchor='start' font-weight='normal' font-family='ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif'>Each full row is one 512-bit vector: stream j's word sits at bytes 4j…4j+3 (little-endian).</text>
<text x='20' y='264' font-size='12' fill='#666666' text-anchor='start' font-weight='normal' font-family='ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif'>The tail holds the last (bits mod 4) bytes of every stream, packed tightly: 0, 16, 32 or 48 bytes.</text>
